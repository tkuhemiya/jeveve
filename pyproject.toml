[project]
name = "jeveve"
version = "0.1.0"
description = "GLiNER2.5 entity extraction API on Modal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "modal==1.5.5",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
    "ty>=0.0.82",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
"scripts/*.py" = ["E402"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["fastapi.Depends", "fastapi.Query", "fastapi.Body", "fastapi.Path"]
