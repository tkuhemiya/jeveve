[project]
name = "jeveve"
version = "0.1.0"
description = "GLiNER2.5 entity extraction API on Modal"
readme = "PLAN.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi[standard]==0.141.1",
    "modal==1.5.5",
    "pydantic==2.13.5",
]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "pytest==9.1.1",
    "ruff==0.16.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
